name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          VERSION_OUTPUT="$(java -version 2>&1 || true)"
          RAW_VERSION="$(printf '%s\n' "${VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f1 | sed 's/[^0-9].*//')"
          fi

          if [ -z "${MAJOR_VERSION}" ] || ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [ -z "${KEYTOOL_BIN}" ]; then
              echo "::error::keytool executable not found in configured Java 17 installation."
              exit 1
            fi

            "${KEYTOOL_BIN}" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Verified ./debug.keystore is present for debug signing."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${APK_PATH}" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi

          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "${APK_PATH}")"
          echo "Verified debug APK: ${APK_PATH} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK missing at ${SOURCE_APK}."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "${REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid at ${ASSET_PATH}."
            exit 1
          fi

          echo "release_asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "release_asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.release_asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.release_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Release asset missing or invalid: ${ASSET_PATH}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"

          cat > "${NOTES_FILE}" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}

          ### Important Notes
          - This APK is intended for testing purposes only.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.release_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_STATUS="${{ steps.upload_artifact.outcome }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          if [ "${RELEASE_STATUS}" = "success" ] && [ -n "${RELEASE_TAG}" ]; then
            gh release view "${RELEASE_TAG}" --json tagName,name,url,assets > /dev/null
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            echo "GitHub Release published successfully."
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build & Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Status:** Published"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct Download Page:** ${RELEASE_URL}"
              echo ""
              echo "The APK can be downloaded directly from the **Assets** section on the GitHub Release page above. The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: ${RELEASE_STATUS}). The APK build succeeded and the Actions artifact 'app-debug-apk' remains available."

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact (\`app-debug-apk\`):** Status = \`${ARTIFACT_STATUS}\` (available as a backup download from this workflow run)"
              echo "- **GitHub Release Status:** Warning — Release publishing failed (outcome: \`${RELEASE_STATUS}\`)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, but the debug APK build completed and the \`app-debug-apk\` Actions artifact remains available in this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
